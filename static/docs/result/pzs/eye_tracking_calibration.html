<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>眼动追踪校准系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            transition: background 0.5s ease;
        }

        /* 底片颜色样式 */
        body.white-bg {
            background: #ffffff;
        }

        body.black-bg {
            background: #000000;
        }

        body.off-white-bg {
            background: #d4d4d4;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            transition: color 0.5s ease;
        }

        .white-bg .header {
            color: #333;
        }

        .black-bg .header {
            color: white;
        }

        .off-white-bg .header {
            color: #333;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* 圆形校准点样式 */
        .calibration-point {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
            border: 2px solid #ddd;
            opacity: 0.8;
        }

        /* 六边形校准点样式 */
        .calibration-point.hexagon {
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            border-radius: 0;
        }

        .calibration-point.active {
            width: 50px;
            height: 50px;
            background: #007AFF;
            border-color: #007AFF;
            box-shadow: 0 8px 30px rgba(0, 122, 255, 0.4);
            animation: pulse 1.5s infinite;
        }

        .calibration-point.completed {
            background: #34C759;
            border-color: #34C759;
            box-shadow: 0 4px 20px rgba(52, 199, 89, 0.4);
        }

        /* 中心点特殊样式 */
        .calibration-point.center-point {
            width: 40px;
            height: 40px;
            background: #FF6B35;
            border-color: #FF6B35;
        }

        .calibration-point.center-point.active {
            width: 60px;
            height: 60px;
            background: #FF6B35;
            border-color: #FF6B35;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .progress-container {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 10;
            transition: color 0.5s ease;
        }

        .white-bg .progress-container {
            color: #333;
        }

        .black-bg .progress-container {
            color: white;
        }

        .off-white-bg .progress-container {
            color: #333;
        }

        .progress-bar {
            width: 300px;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
            overflow: hidden;
        }

        .black-bg .progress-bar {
            background: rgba(255,255,255,0.3);
        }

        .progress-fill {
            height: 100%;
            background: #007AFF;
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }

        /* 形状选择器 */
        .shape-selector {
            position: absolute;
            top: 40px;
            left: 40px;
            display: flex;
            gap: 10px;
            z-index: 15;
        }

        /* 颜色选择器 */
        .color-selector {
            position: absolute;
            top: 40px;
            right: 40px;
            display: flex;
            gap: 10px;
            z-index: 15;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.active {
            border-color: #007AFF;
            transform: scale(1.1);
        }

        .color-option.white {
            background: #ffffff;
            border: 2px solid #ddd;
        }

        .color-option.black {
            background: #000000;
        }

        .color-option.off-white {
            background: #d4d4d4;
            border: 2px solid #ddd;
        }

        .shape-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #333;
        }

        .shape-option:hover {
            transform: scale(1.1);
        }

        .shape-option.active {
            border-color: #007AFF;
            transform: scale(1.1);
        }

        .shape-option.circle {
            border-radius: 50%;
        }

        .shape-option.hexagon {
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            border-radius: 0;
        }

        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .start-content {
            text-align: center;
            color: white;
            max-width: 500px;
            padding: 40px;
        }

        .start-button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .start-button:hover {
            background: #0056CC;
            transform: translateY(-2px);
        }

        .completion-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
        }

        .download-button {
            background: #34C759;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            margin-right: 15px;
        }

        /* 视线离开提醒 */
        .attention-alert {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
            text-align: center;
        }

        .attention-alert h2 {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: blink 1s infinite;
        }

        .attention-alert p {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .attention-alert button {
            background: white;
            color: #ff0000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
    </style>
</head>
<body class="white-bg">
    <div class="container">
        <!-- 布局选择器 -->
        <div class="shape-selector">
            <div class="shape-option circle active" onclick="changeLayout('rectangle')" title="矩形布局">□</div>
            <div class="shape-option hexagon" onclick="changeLayout('hexagon')" title="六边形布局">⬡</div>
        </div>

        <!-- 颜色选择器 -->
        <div class="color-selector">
            <div class="color-option white active" onclick="changeBackground('white')" title="白色背景"></div>
            <div class="color-option black" onclick="changeBackground('black')" title="黑色背景"></div>
            <div class="color-option off-white" onclick="changeBackground('off-white')" title="偏白背景"></div>
        </div>

        <div class="header">
            <h1>眼动追踪校准</h1>
            <p>请注视屏幕上的校准点</p>
        </div>

        <div class="progress-container">
            <div class="progress-text" id="progressText">0 / 9</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="start-screen" id="startScreen">
            <div class="start-content">
                <h2>眼动追踪校准</h2>
                <p>请确保头部稳定，注视校准点，保持眼睛睁开</p>
                <p style="margin-top: 20px; font-size: 0.9rem; color: #ccc;">
                    提示：请选择您喜欢的背景颜色，校准过程中请勿离开屏幕
                </p>
                <p style="margin-top: 10px; font-size: 0.9rem; color: #ccc;">
                    特征点说明：可选择矩形或六边形分布，中心点为橙色圆形
                </p>
                <div style="margin-top: 15px;">
                    <label style="color: #ccc; font-size: 0.9rem;">
                        <input type="checkbox" id="enableAttentionCheck" checked style="margin-right: 8px;">
                        启用视线检测（检测到视线离开时暂停校准）
                    </label>
                </div>
                <button class="start-button" onclick="startCalibration()">开始校准</button>
            </div>
        </div>

        <div class="completion-screen" id="completionScreen">
            <div class="start-content">
                <h2>校准完成</h2>
                <p>校准数据已收集完成</p>
                <button class="download-button" onclick="downloadData()">下载数据</button>
                <button class="start-button" onclick="restartCalibration()">重新校准</button>
            </div>
        </div>

        <!-- 视线离开提醒 -->
        <div class="attention-alert" id="attentionAlert">
            <h2>⚠️ 注意力提醒</h2>
            <p>检测到您的视线离开了屏幕</p>
            <p>校准过程已暂停</p>
            <button onclick="resumeCalibration()">继续校准</button>
        </div>
    </div>

    <script>
        class EyeTrackingCalibration {
            constructor() {
                // 9个校准点：8个边缘点 + 1个中心点
                this.calibrationPoints = [
                    // 边缘点（矩形布局）
                    { x: 10, y: 10, type: 'edge' },    // 左上
                    { x: 90, y: 10, type: 'edge' },    // 右上
                    { x: 10, y: 90, type: 'edge' },    // 左下
                    { x: 90, y: 90, type: 'edge' },    // 右下
                    { x: 10, y: 50, type: 'edge' },    // 左中
                    { x: 90, y: 50, type: 'edge' },    // 右中
                    { x: 50, y: 10, type: 'edge' },    // 上中
                    { x: 50, y: 90, type: 'edge' },    // 下中
                    // 中心点
                    { x: 50, y: 50, type: 'center' }   // 中心
                ];

                // 六边形布局的校准点（真正的六边形分布）
                this.hexagonPoints = [
                    // 六边形顶点
                    { x: 50, y: 10, type: 'edge' },    // 上顶点
                    { x: 85, y: 25, type: 'edge' },    // 右上顶点
                    { x: 85, y: 75, type: 'edge' },    // 右下顶点
                    { x: 50, y: 90, type: 'edge' },    // 下顶点
                    { x: 15, y: 75, type: 'edge' },    // 左下顶点
                    { x: 15, y: 25, type: 'edge' },    // 左上顶点
                    // 六边形边的中点
                    { x: 67.5, y: 17.5, type: 'edge' }, // 上右中点
                    { x: 67.5, y: 82.5, type: 'edge' }, // 下右中点
                    { x: 32.5, y: 82.5, type: 'edge' }, // 下左中点
                    { x: 32.5, y: 17.5, type: 'edge' }, // 上左中点
                    // 中心点
                    { x: 50, y: 50, type: 'center' }   // 中心
                ];
                
                this.currentPointIndex = 0;
                this.calibrationData = [];
                this.pointDuration = 3000;
                this.transitionDuration = 1000;
                this.isCalibrating = false;
                this.isPaused = false;
                
                // 视线检测相关
                this.lastMouseMove = Date.now();
                this.mouseInactivityThreshold = 5000; // 5秒无鼠标移动视为视线离开（增加阈值）
                this.mouseCheckInterval = null;
                
                this.init();
            }

            init() {
                this.createCalibrationPoints();
                this.setupMouseTracking();
            }

            createCalibrationPoints() {
                const container = document.querySelector('.container');
                
                // 清除现有的校准点
                const existingPoints = container.querySelectorAll('.calibration-point');
                existingPoints.forEach(point => point.remove());
                
                // 获取当前布局
                const currentLayout = this.getCurrentLayout();
                const pointsToUse = currentLayout === 'hexagon' ? this.hexagonPoints : this.calibrationPoints;
                
                pointsToUse.forEach((point, index) => {
                    const pointElement = document.createElement('div');
                    pointElement.className = 'calibration-point';
                    pointElement.id = `point-${index}`;
                    pointElement.style.left = `${point.x}%`;
                    pointElement.style.top = `${point.y}%`;
                    pointElement.style.transform = 'translate(-50%, -50%)';
                    
                    // 为中心点添加特殊样式
                    if (point.type === 'center') {
                        pointElement.classList.add('center-point');
                    }
                    
                    container.appendChild(pointElement);
                    
                    // 调试信息
                    console.log(`创建校准点 ${index + 1}: 位置(${point.x}%, ${point.y}%), 类型: ${point.type}`);
                });
                
                console.log(`总共创建了 ${pointsToUse.length} 个校准点，布局: ${currentLayout}`);
                
                // 更新进度显示
                this.updateProgressDisplay(pointsToUse.length);
            }

            getCurrentLayout() {
                const shapeOptions = document.querySelectorAll('.shape-option');
                let currentLayout = 'rectangle';
                
                shapeOptions.forEach(option => {
                    if (option.classList.contains('active')) {
                        currentLayout = option.classList.contains('hexagon') ? 'hexagon' : 'rectangle';
                    }
                });
                
                return currentLayout;
            }

            updateProgressDisplay(pointCount) {
                const progressText = document.getElementById('progressText');
                if (progressText) {
                    progressText.textContent = `0 / ${pointCount}`;
                }
            }



            setupMouseTracking() {
                // 监听鼠标移动
                document.addEventListener('mousemove', () => {
                    this.lastMouseMove = Date.now();
                    if (this.isPaused) {
                        this.hideAttentionAlert();
                    }
                });

                // 监听鼠标离开窗口
                document.addEventListener('mouseleave', () => {
                    if (this.isCalibrating && !this.isPaused) {
                        const enableCheck = document.getElementById('enableAttentionCheck');
                        if (enableCheck && enableCheck.checked) {
                            this.showAttentionAlert();
                        }
                    }
                });

                // 定期检查鼠标活动 - 增加检测间隔，减少敏感度
                this.mouseCheckInterval = setInterval(() => {
                    if (this.isCalibrating && !this.isPaused) {
                        const enableCheck = document.getElementById('enableAttentionCheck');
                        if (enableCheck && enableCheck.checked) {
                            const timeSinceLastMove = Date.now() - this.lastMouseMove;
                            if (timeSinceLastMove > this.mouseInactivityThreshold) {
                                this.showAttentionAlert();
                            }
                        }
                    }
                }, 1000); // 从500ms改为1000ms
            }

            showAttentionAlert() {
                this.isPaused = true;
                document.getElementById('attentionAlert').style.display = 'flex';
            }

            hideAttentionAlert() {
                this.isPaused = false;
                document.getElementById('attentionAlert').style.display = 'none';
            }

            startCalibration() {
                this.currentPointIndex = 0;
                this.calibrationData = [];
                this.isCalibrating = true;
                this.isPaused = false;
                
                document.getElementById('startScreen').style.display = 'none';
                this.showNextPoint();
            }

            showNextPoint() {
                const currentLayout = this.getCurrentLayout();
                const pointsToUse = currentLayout === 'hexagon' ? this.hexagonPoints : this.calibrationPoints;
                
                if (this.currentPointIndex >= pointsToUse.length) {
                    this.completeCalibration();
                    return;
                }

                // 如果暂停，等待恢复
                if (this.isPaused) {
                    setTimeout(() => this.showNextPoint(), 500); // 增加等待时间
                    return;
                }

                document.querySelectorAll('.calibration-point').forEach(point => {
                    point.classList.remove('active', 'completed');
                });

                const currentPoint = document.getElementById(`point-${this.currentPointIndex}`);
                if (currentPoint) {
                    currentPoint.classList.add('active');
                }

                this.updateProgress();
                this.collectData();

                setTimeout(() => {
                    if (!this.isPaused) {
                        if (currentPoint) {
                            currentPoint.classList.remove('active');
                            currentPoint.classList.add('completed');
                        }
                        
                        setTimeout(() => {
                            this.currentPointIndex++;
                            this.showNextPoint();
                        }, this.transitionDuration);
                    } else {
                        // 如果暂停了，重新开始当前点
                        this.showNextPoint();
                    }
                }, this.pointDuration);
            }

            collectData() {
                const currentLayout = this.getCurrentLayout();
                const pointsToUse = currentLayout === 'hexagon' ? this.hexagonPoints : this.calibrationPoints;
                const point = pointsToUse[this.currentPointIndex];
                const timestamp = Date.now();
                
                const eyeData = {
                    pointIndex: this.currentPointIndex,
                    pointType: point.type,
                    targetPosition: { x: point.x, y: point.y },
                    timestamp: timestamp,
                    duration: this.pointDuration,
                    gazeData: this.simulateGazeData(point),
                    systemInfo: {
                        screenWidth: window.innerWidth,
                        screenHeight: window.innerHeight,
                        userAgent: navigator.userAgent,
                        timestamp: new Date().toISOString(),
                        background: document.body.className
                    }
                };
                
                this.calibrationData.push(eyeData);
            }

            simulateGazeData(targetPoint) {
                const samples = [];
                const sampleCount = Math.floor(this.pointDuration / 16);
                
                for (let i = 0; i < sampleCount; i++) {
                    const timeOffset = (i / sampleCount) * this.pointDuration;
                    const noiseX = (Math.random() - 0.5) * 2;
                    const noiseY = (Math.random() - 0.5) * 2;
                    
                    samples.push({
                        timestamp: Date.now() + timeOffset,
                        x: targetPoint.x + noiseX,
                        y: targetPoint.y + noiseY,
                        confidence: 0.8 + Math.random() * 0.2,
                        pupilDiameter: 3.5 + Math.random() * 0.5,
                        fixation: i > sampleCount * 0.1
                    });
                }
                
                return samples;
            }

            updateProgress() {
                const currentLayout = this.getCurrentLayout();
                const pointsToUse = currentLayout === 'hexagon' ? this.hexagonPoints : this.calibrationPoints;
                const progress = (this.currentPointIndex + 1) / pointsToUse.length;
                const progressFill = document.getElementById('progressFill');
                const progressText = document.getElementById('progressText');
                
                progressFill.style.width = `${progress * 100}%`;
                progressText.textContent = `${this.currentPointIndex + 1} / ${pointsToUse.length}`;
                
                // 添加调试信息
                console.log(`校准进度: ${this.currentPointIndex + 1}/${pointsToUse.length}, 暂停状态: ${this.isPaused}, 布局: ${currentLayout}`);
            }

            completeCalibration() {
                this.isCalibrating = false;
                document.getElementById('completionScreen').style.display = 'flex';
            }

            getCalibrationData() {
                // 获取当前选择的布局
                const currentLayout = this.getCurrentLayout();
                const pointsToUse = currentLayout === 'hexagon' ? this.hexagonPoints : this.calibrationPoints;

                return {
                    metadata: {
                        version: "2.2",
                        calibrationType: `${pointsToUse.length}-point-${currentLayout}`,
                        timestamp: new Date().toISOString(),
                        duration: this.calibrationData.length * this.pointDuration,
                        pointCount: pointsToUse.length,
                        background: document.body.className,
                        layout: currentLayout,
                        features: ["layout-selection", "center-point", "background-selection", "attention-monitoring"]
                    },
                    calibrationPoints: pointsToUse,
                    calibrationData: this.calibrationData
                };
            }

            downloadData() {
                const data = this.getCalibrationData();
                const jsonString = JSON.stringify(data, null, 2);
                const blob = new Blob([jsonString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `eye_tracking_calibration_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            restart() {
                this.currentPointIndex = 0;
                this.calibrationData = [];
                this.isCalibrating = false;
                this.isPaused = false;
                
                document.querySelectorAll('.calibration-point').forEach(point => {
                    point.classList.remove('active', 'completed');
                });
                
                document.getElementById('startScreen').style.display = 'flex';
                document.getElementById('completionScreen').style.display = 'none';
                this.hideAttentionAlert();
                
                this.updateProgress();
            }
        }

        let calibration;

        document.addEventListener('DOMContentLoaded', () => {
            calibration = new EyeTrackingCalibration();
        });

        function startCalibration() {
            calibration.startCalibration();
        }

        function downloadData() {
            calibration.downloadData();
        }

        function restartCalibration() {
            calibration.restart();
        }

        function resumeCalibration() {
            calibration.hideAttentionAlert();
        }

        function changeBackground(color) {
            // 移除所有背景类
            document.body.classList.remove('white-bg', 'black-bg', 'off-white-bg');
            
            // 添加新的背景类
            document.body.classList.add(`${color}-bg`);
            
            // 更新颜色选择器的激活状态
            document.querySelectorAll('.color-option').forEach(option => {
                option.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function changeLayout(layout) {
            // 更新布局选择器的激活状态
            document.querySelectorAll('.shape-option').forEach(option => {
                option.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 重新创建校准点
            if (calibration) {
                calibration.createCalibrationPoints();
            }
        }
    </script>
</body>
</html>
